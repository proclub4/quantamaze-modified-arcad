<section id="qam-arcade" aria-label="Q-Bits Arcade — playable challenge">
  <div class="qam-inner">
    <p class="qam-kicker">Level up while you explore</p>
    <h2 class="qam-title">Q-Bits Arcade</h2>
    <p class="qam-sub">A quick, playable challenge inspired by our hackathon. No sign-up needed — just a few minutes of fun while you look around.</p>
    <div class="qam-grid qam-grid-single">

      <button type="button" class="qam-card" data-qam-game="maze">
        <span class="qam-corner tr" aria-hidden="true">+</span>
        <span class="qam-corner br" aria-hidden="true">+</span>
        <div class="qam-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"></path><circle cx="12" cy="12" r="10"></circle></svg></div>
        <span class="qam-tag">ARCADE // 01</span>
        <h3>Q-Maze Runner</h3>
        <p>Navigate a qubit through a shifting maze as fast as you can.</p>
        <span class="qam-meta">
          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"></path></svg>Easy</span>
          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>~1 min</span>
          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 20h5v-1a4 4 0 0 0-3-3.87M9 20H4v-1a4 4 0 0 1 3-3.87m6-1a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z"></path><circle cx="9" cy="9" r="3"></circle></svg>Solo</span>
        </span>
        <span class="qam-play">Play now <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
      </button>

      <button type="button" class="qam-card" data-qam-game="coin">
        <span class="qam-corner tr" aria-hidden="true">+</span>
        <span class="qam-corner br" aria-hidden="true">+</span>
        <div class="qam-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="6" stroke-width="1.2"></circle><path d="M12 8v8M9.5 9.6h5M9.5 14.4h5" stroke-width="1.2"></path></svg></div>
        <span class="qam-tag">ARCADE // 02</span>
        <h3>Quantum Coin Flip</h3>
        <p>Predict the state of the coin — heads, tails, or split the reality itself.</p>
        <span class="qam-meta">
          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"></path></svg>Easy</span>
          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>~30 sec</span>
          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 20h5v-1a4 4 0 0 0-3-3.87M9 20H4v-1a4 4 0 0 1 3-3.87m6-1a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z"></path><circle cx="9" cy="9" r="3"></circle></svg>Solo</span>
        </span>
        <span class="qam-play">Play now <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
      </button>

      <button type="button" class="qam-card" data-qam-game="core">
        <span class="qam-corner tr" aria-hidden="true">+</span>
        <span class="qam-corner br" aria-hidden="true">+</span>
        <div class="qam-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="9"></circle><path d="M12 3v3.4M12 17.6V21M21 12h-3.4M6.4 12H3M18.36 5.64l-2.4 2.4M8.04 15.96l-2.4 2.4M18.36 18.36l-2.4-2.4M8.04 8.04l-2.4-2.4"></path></svg></div>
        <span class="qam-tag">ARCADE // 03</span>
        <h3>Defuse the Quantum Core</h3>
        <p>Answer quick quantum questions to stabilize the reactor before your qubits decohere.</p>
        <span class="qam-meta">
          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"></path><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z" opacity=".4" transform="translate(2,0)"></path></svg>Medium</span>
          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>~2 min</span>
          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 20h5v-1a4 4 0 0 0-3-3.87M9 20H4v-1a4 4 0 0 1 3-3.87m6-1a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z"></path><circle cx="9" cy="9" r="3"></circle></svg>Solo</span>
        </span>
        <span class="qam-play">Play now <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
      </button>

      <button type="button" class="qam-card" data-qam-game="ttt">
        <span class="qam-corner tr" aria-hidden="true">+</span>
        <span class="qam-corner br" aria-hidden="true">+</span>
        <div class="qam-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v18M15 3v18M3 9h18M3 15h18"></path><path d="M5.4 5.4l2.2 2.2M7.6 5.4l-2.2 2.2" stroke-width="2"></path><circle cx="12" cy="12" r="2.1" stroke-width="1.6"></circle><path d="M17.1 16.9l2.2 2.2M19.3 16.9l-2.2 2.2" stroke-width="2"></path></svg></div>
        <span class="qam-tag">ARCADE // 04</span>
        <h3>Schrödinger's Showdown</h3>
        <p>Quantum Tic-Tac-Toe — place ghost pieces in two squares at once and force reality to choose.</p>
        <span class="qam-meta">
          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"></path><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z" opacity=".4" transform="translate(2,0)"></path></svg>Hard</span>
          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>~3 min</span>
          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"></path><path d="M4 21v-1a6 6 0 0 1 6-6h0M20 21v-1a4 4 0 0 0-3-3.87"></path><circle cx="18" cy="8" r="2.5"></circle></svg>You vs CPU</span>
        </span>
        <span class="qam-play">Play now <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
      </button>

    </div>
  </div>
</section>

<div class="qam-overlay" id="qam-overlay" aria-hidden="true">
  <div class="qam-modal" role="dialog" aria-modal="true" aria-labelledby="qam-modal-title">
    <button type="button" class="qam-modal-close" id="qam-modal-close" aria-label="Close game">×</button>
    <span class="qam-modal-tag" id="qam-modal-tag">ARCADE // 01</span>
    <h3 id="qam-modal-title">Q-Maze Runner</h3>
    <p class="qam-modal-desc" id="qam-modal-desc"></p>
    <div class="qam-modal-body" id="qam-modal-body"></div>
  </div>
</div>
